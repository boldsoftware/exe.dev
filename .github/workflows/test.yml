name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Test Python packages
        run: |
          for dir in */; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "=== testing $dir ==="
              uv run --project "$dir" python -m unittest discover -s "$dir/tests" -v
              uv build --project "$dir"
              uvx --from "./$dir" "${dir%/}" --help
            fi
          done
          python3 bin/experimental-exe-ssh.py --help

      - name: Test all Go modules
        run: |
          for dir in */; do
            if [ -f "$dir/go.mod" ]; then
              echo "=== testing $dir ==="
              (cd "$dir" && go test ./...)
            fi
          done

  auto-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto-tag changed modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for dir in */; do
            [ -f "$dir/go.mod" ] || continue
            module="${dir%/}"
            latest_tag=$(git tag -l "$module/v*" --sort=-v:refname | head -1)
            if [ -n "$latest_tag" ] && [ -z "$(git diff "$latest_tag" -- "$module/")" ]; then
              echo "=== $module: no changes since $latest_tag, skipping ==="
              continue
            fi
            COUNT=$(git rev-list --count HEAD -- "$module/")
            SHORT_SHA=$(git rev-parse --short=6 HEAD)
            SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
            TAG="${module}/v0.${COUNT}.9${SHA_OCTAL}"
            if git tag -l "$TAG" | grep -q .; then
              echo "=== $module: $TAG already exists, skipping ==="
              continue
            fi
            echo "=== tagging $module as $TAG ==="
            git tag -a "$TAG" -m "Auto-tag $module at ${SHORT_SHA}"
            git push origin "$TAG"
          done

  release-exe-scroll:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: release-exe-scroll
      cancel-in-progress: false
    permissions:
      contents: write
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and release exe-scroll
        env:
          GH_TOKEN: ${{ github.token }}
        run: exe-scroll/release.sh
